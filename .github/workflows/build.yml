name: Build Kernel
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取源码
      - uses: actions/checkout@v4
      # 安装编译工具链
      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu bc zip git curl libssl-dev
      # 注入KernelSU
      - name: Inject KernelSU
        run: curl -LSs https://mirror.ghproxy.com/https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash
      # 加载机型配置，自动应答所有交互弹窗（解决循环弹窗/读取报错核心）
      - name: Load psyche config
        run: |
          cp arch/arm64/configs/vendor/xiaomi/psyche.config .config
          yes "" | make ARCH=arm64 olddefconfig
      # 开启KSU与完整符号表（仅修复你最初SuKisu报错的必要参数）
      - name: Enable KSU & symbols
        run: |
          echo "CONFIG_KALLSYMS=y" >> .config
          echo "CONFIG_KALLSYMS_ALL=y" >> .config
          echo "CONFIG_KSU=y" >> .config
          yes "" | make ARCH=arm64 olddefconfig
      # 标准编译，限制线程避免内存爆
      - name: Compile kernel
        run: make -j4 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
      # 打包AnyKernel3
      - name: Pack AnyKernel3
        run: |
          git clone https://mirror.ghproxy.com/https://github.com/osm0sis/AnyKernel3 AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          cd AK3 && zip -r kernel.zip *
      # 输出刷机包
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: psyche-kernel
          path: AK3/kernel.zip
